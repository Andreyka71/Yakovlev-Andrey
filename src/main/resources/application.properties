spring.application.name=homework1
server.port=8081

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=shutdown
management.endpoints.web.base-path=/admin

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=123

spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
logging.level.org.flywaydb=TRACE

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

resilience4j.ratelimiter.instances.apiRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.apiRateLimiter.limit-refresh-period=10s
resilience4j.ratelimiter.instances.apiRateLimiter.timeout-duration=0

resilience4j.circuitbreaker.instances.apiCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.apiCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.apiCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.apiCircuitBreaker.sliding-window-type=count_based
resilience4j.circuitbreaker.instances.apiCircuitBreaker.sliding-window-size=10
